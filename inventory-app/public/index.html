<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在庫管理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%232563eb%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="app-header">
    <h1>在庫管理</h1>
    <nav class="tabs" aria-label="メニュー">
      <a href="#stock" data-tab="stock">在庫</a>
      <a href="#transfers" data-tab="transfers">移動・サンプル</a>
      <a href="#invoices" data-tab="invoices">請求書</a>
      <a href="#masters" data-tab="masters">マスタ</a>
    </nav>
    <div id="user-bar" class="user-bar row" hidden>
      <span id="user-name" class="muted"></span>
      <span class="spacer"></span>
      <button type="button" class="ghost small" id="pin-btn">PIN変更</button>
      <button type="button" class="ghost small" id="logout-btn">ログアウト</button>
    </div>
    <div class="local-only row" style="padding:6px 0">
      <span class="muted">テスト用: データはこのブラウザ内にだけ保存されます</span>
      <span class="spacer"></span>
      <button type="button" class="ghost small danger" id="local-reset">データを初期化</button>
    </div>
  </header>

  <main id="view" class="container"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="pin-dialog">
    <form id="pin-form" class="dialog-form">
      <h2>PINを変更</h2>
      <label>現在のPIN<input name="current_pin" type="password" inputmode="numeric" maxlength="6" required></label>
      <label>新しいPIN(4〜6桁)<input name="new_pin" type="password" inputmode="numeric" pattern="\d{4,6}" maxlength="6" required></label>
      <label>新しいPIN(確認)<input name="confirm_pin" type="password" inputmode="numeric" pattern="\d{4,6}" maxlength="6" required></label>
      <div class="row"><span class="spacer"></span>
        <button type="button" class="ghost" id="pin-cancel">キャンセル</button>
        <button type="submit">変更する</button>
      </div>
    </form>
  </dialog>

  <dialog id="invoice-dialog">
    <div class="dialog-actions no-print">
      <button type="button" id="invoice-print-btn">印刷 / PDF保存</button>
      <button type="button" class="ghost" id="invoice-close-btn">閉じる</button>
    </div>
    <div id="invoice-print"></div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
